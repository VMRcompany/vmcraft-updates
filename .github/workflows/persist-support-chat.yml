name: Persist support chat

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Merge ntfy into gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 9dcb8cd50eff9c5c2e194e44cc0145e1
        run: |
          python3 - <<'PY'
          import base64, json, os, urllib.request
          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          prefix = "vmcraft-advid-9dcb8-"
          registry = "vmcraft-advid-registry-9dcb8"
          MAX_B64 = 400_000

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "VMcraft"})
              with urllib.request.urlopen(req, timeout=40) as r:
                  return r.read()

          def ntfy(topic):
              try:
                  raw = get("https://ntfy.sh/%s/json?poll=1" % topic).decode("utf-8", "replace").strip()
              except Exception:
                  return []
              if not raw:
                  return []
              out = []
              for line in raw.splitlines():
                  try:
                      out.append(json.loads(line))
                  except Exception:
                      pass
              return out

          def key_of(msg):
              return (msg.get("time"), msg.get("role"), msg.get("text") or "", msg.get("fileName") or "")

          def attach_bytes(ev):
              att = ev.get("attachment") or {}
              url = att.get("url")
              if not url:
                  return None, None
              try:
                  data = get(url)
              except Exception:
                  return url, None
              if not data or len(data) > MAX_B64:
                  return url, None
              return url, base64.b64encode(data).decode("ascii")

          ids = []
          for ev in ntfy(registry):
              tid = (ev.get("message") or "").strip()
              if tid and tid not in ids:
                  ids.append(tid)

          req = urllib.request.Request(
              "https://api.github.com/gists/" + gist_id,
              headers={"User-Agent": "VMcraft", "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"},
          )
          with urllib.request.urlopen(req, timeout=20) as r:
              gist = json.loads(r.read().decode())
          content = gist.get("files", {}).get("index.json", {}).get("content") or '{"threads":[]}'
          feed = json.loads(content)
          threads = {t.get("id"): t for t in (feed.get("threads") or []) if t.get("id")}

          for tid in ids:
              t = threads.get(tid) or {"id": tid, "messages": [], "updated": 0, "preview": ""}
              msgs = list(t.get("messages") or [])
              seen = {key_of(m): m for m in msgs}
              topic = prefix + tid.replace("-", "").lower()
              for ev in ntfy(topic):
                  try:
                      msg = json.loads(ev.get("message") or "{}")
                  except Exception:
                      continue
                  if not isinstance(msg, dict):
                      continue
                  att = ev.get("attachment") or {}
                  if att.get("name") and not msg.get("fileName"):
                      msg["fileName"] = att.get("name")
                  if att.get("type") and not msg.get("mime"):
                      msg["mime"] = att.get("type")
                  url, b64 = attach_bytes(ev)
                  if url:
                      msg["fileUrl"] = url
                  if b64:
                      msg["fileBase64"] = b64
                  k = key_of(msg)
                  if k in seen:
                      old = seen[k]
                      if msg.get("fileUrl"):
                          old["fileUrl"] = msg["fileUrl"]
                      if msg.get("fileBase64"):
                          old["fileBase64"] = msg["fileBase64"]
                      if msg.get("fileName") and not old.get("fileName"):
                          old["fileName"] = msg["fileName"]
                      if msg.get("mime") and not old.get("mime"):
                          old["mime"] = msg["mime"]
                      continue
                  if not (msg.get("text") or "").strip() and not msg.get("fileName") and not msg.get("fileUrl") and not msg.get("fileBase64"):
                      continue
                  msgs.append(msg)
                  seen[k] = msg
              msgs.sort(key=lambda m: m.get("time") or 0)
              t["messages"] = msgs[-200:]
              if msgs:
                  last = msgs[-1]
                  t["preview"] = last.get("text") or last.get("fileName") or ""
                  t["updated"] = last.get("time") or t.get("updated") or 0
              threads[tid] = t

          ordered = sorted(threads.values(), key=lambda t: t.get("updated") or 0, reverse=True)
          body = json.dumps({"threads": ordered}, ensure_ascii=False, separators=(",", ":"))
          payload = json.dumps({"files": {"index.json": {"content": body}}}).encode("utf-8")
          req = urllib.request.Request(
              "https://api.github.com/gists/" + gist_id,
              data=payload,
              method="PATCH",
              headers={
                  "User-Agent": "VMcraft",
                  "Authorization": "Bearer " + token,
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=60) as r:
              r.read()
          print("threads", len(ordered), "bytes", len(body))
          PY
